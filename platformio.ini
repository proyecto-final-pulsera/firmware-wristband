; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nicla_sense_me]
platform = nordicnrf52
board = nicla_sense_me
framework = arduino
lib_deps = 
	arduino-libraries/ArduinoBLE
	; Se comenta la libreria remota original y se utiliza la version local podada en 'lib/Arduino_BHY2'.
	; Esto evita enlazar BLEHandler, DFUManager y EslovHandler, ahorrando ~2.2 KB de RAM (Heap + .bss).
	; arduino-libraries/Arduino_BHY2@^1.0.8
build_flags = 
	-I test
	-D NO_NEED_FOR_WATCHDOG_THREAD
build_src_filter = +<*> -<.git/> -<.svn/>
monitor_speed = 115200
